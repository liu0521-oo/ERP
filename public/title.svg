      <stop offset="0%" stop-color="#2dd4bf"></stop>
      <stop offset="100%" stop-color="#1e3a8a"></stop>
    </linearGradient>
  </defs>

  <!-- 背景圆角 -->
  <rect x="4" y="4" width="56" height="56" rx="14" fill="#ffffff"></rect>

  <!-- 速度线 -->
