  <rect x="10" y="30" width="14" height="4" rx="2" fill="#1e3a8a" opacity="0.5"></rect>
  <rect x="12" y="38" width="10" height="4" rx="2" fill="#1e3a8a" opacity="0.4"></rect>

  <!-- 主体H -->
  <rect x="22" y="16" width="30" height="32" rx="8" fill="url(#g)"></rect>
  
  <!-- H字 -->
  <rect x="30" y="24" width="4" height="16" fill="#fff"></rect>
  <rect x="40" y="24" width="4" height="16" fill="#fff"></rect>
  <rect x="30" y="32" width="14" height="4" fill="#fff"></rect>
